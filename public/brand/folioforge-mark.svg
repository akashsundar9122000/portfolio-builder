<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17181c"/><stop offset="1" stop-color="#08080a"/></linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8a4a14" stop-opacity="0.15"/>
      <stop offset="0.45" stop-color="#d9822b" stop-opacity="0.9"/>
      <stop offset="0.75" stop-color="#ffc27a"/>
      <stop offset="1" stop-color="#fff3dc"/>
    </linearGradient>
    <radialGradient id="flare" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fffaf0"/><stop offset="0.25" stop-color="#ffd08a" stop-opacity="0.9"/><stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow" cx="0.72" cy="0.22" r="0.6"><stop offset="0" stop-color="#ff9a3c" stop-opacity="0.16"/><stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/></radialGradient>
    <linearGradient id="chromeA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#d9dbe0"/><stop offset="1" stop-color="#8d9098"/></linearGradient>
    <linearGradient id="chromeB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a7aab2"/><stop offset="0.6" stop-color="#5e616a"/><stop offset="1" stop-color="#3a3c42"/></linearGradient>
    <linearGradient id="chromeC" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c9ccd2"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#bfc2c9"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#glow)"/>
  <!-- ring -->
  <circle cx="256" cy="256" r="164" fill="none" stroke="#c46a1e" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="256" cy="256" r="164" fill="none" stroke="url(#arc)" stroke-width="10" filter="url(#blur)" opacity="0.8"
          stroke-dasharray="560 1031" stroke-dashoffset="-560" transform="rotate(0 256 256)"/>
  <circle cx="256" cy="256" r="164" fill="none" stroke="url(#arc)" stroke-width="3.5" stroke-linecap="round"
          stroke-dasharray="560 1031" stroke-dashoffset="-560"/>
  <!-- flare near top-right of the ring -->
  <ellipse cx="361" cy="130" rx="38" ry="38" fill="url(#flare)" opacity="0.95"/>
  <ellipse cx="361" cy="130" rx="42" ry="2.2" fill="#fff1d6" opacity="0.75" filter="url(#soft)" transform="rotate(-12 361 130)"/>
  <!-- chrome F, leaning forward -->
  <g transform="translate(256 262) skewX(-10) translate(-256 -262)">
    <polygon points="200,178 228,168 228,338 200,358" fill="url(#chromeA)"/>
    <polygon points="228,168 250,160 250,318 228,338" fill="url(#chromeB)"/>
    <polygon points="232,160 350,160 326,202 232,202" fill="url(#chromeC)"/>
    <polygon points="232,202 262,202 232,222" fill="#2b2c31" opacity="0.8"/>
    <polygon points="238,236 320,236 298,272 238,272" fill="url(#chromeA)"/>
    <polygon points="238,272 260,272 238,286" fill="#2b2c31" opacity="0.7"/>
  </g>
</svg>
